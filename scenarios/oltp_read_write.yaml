# OLTP Read/Write Test Scenario
#
# Balanced workload with 60% reads and 40% writes.
# Typical OLTP application pattern.
#
# Usage:
#   rsbench --scenario scenarios/oltp_read_write.yaml run

# Infrastructure configuration (database, pool, runtime)
config: ../config/rsbench.config.yaml

scenario:
  # Executor: How to apply load
  executor:
    type: constant-rate
    rate: 1000          # 1000 operations per second
    duration: 60s       # Run for 60 seconds
    max_connections: 50

  # Workload: What operations to execute
  workload:
    type: declarative
    file: workloads/oltp_read_write.yaml
    # Using default settings (10 tables, 10000 rows each)

# Determinism settings (optional)
determinism:
  seed: 42
  strict_mode: false

# Optional: Override output settings for this scenario
# output:
#   format: json
#   file: results/oltp_read_write.json
