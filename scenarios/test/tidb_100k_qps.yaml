# TiDB 100K QPS Test Scenario
#
# Extreme high-throughput test targeting 100K operations per second
# Tests TiDB's maximum sustainable throughput

# Infrastructure configuration
config: ../config/test/tidb_100k.yaml

scenario:
  executor:
    type: constant-rate
    rate: 100000          # Target: 100K ops/sec
    duration: 60s         # Run for 60 seconds
    max_connections: 200  # High concurrency

  workload:
    type: declarative
    file: ../workloads/oltp_point_select.yaml
    overrides:
      schema:
        tables:
          - count: 10
            row_count: 100000   # 1M total rows

determinism:
  seed: 42
  strict_mode: false

output:
  format: text
  file: null
