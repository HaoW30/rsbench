# 10K QPS Read-Only Test Scenario - 20 Connections
#
# Read-only test to drive 10K queries per second
# with minimal connection count (20) to test backpressure behavior

# Infrastructure configuration (limited to 20 connections)
config: ../config/test/mysql_port4000_20conn.yaml

scenario:
  executor:
    type: constant-rate
    rate: 10000         # Target: 10K ops/sec
    duration: 60s       # Run for 60 seconds
    max_connections: 20  # Low concurrency

  workload:
    type: declarative
    file: workloads/oltp_point_select.yaml
    overrides:
      schema:
        tables:
          - count: 10           # 10 tables
            row_count: 100000   # 100K rows per table (1M total rows)

determinism:
  seed: 42
  strict_mode: false
