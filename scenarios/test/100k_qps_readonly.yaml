# 100K QPS Read-Only Test Scenario
#
# High-throughput read-only test to drive 100K queries per second
# Uses point select (simplest read operation) for maximum throughput

# Infrastructure configuration (requires high connection pool)
config: ../config/test/mysql_port4000.yaml

scenario:
  executor:
    type: constant-rate
    rate: 100000        # Target: 100K ops/sec
    duration: 60s       # Run for 60 seconds
    max_connections: 1000  # High concurrency

  workload:
    type: declarative
    file: workloads/oltp_point_select.yaml
    overrides:
      schema:
        tables:
          - count: 10           # 10 tables
            row_count: 100000   # 100K rows per table (1M total rows)

determinism:
  seed: 42
  strict_mode: false
