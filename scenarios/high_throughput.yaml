# High Throughput Test Scenario
#
# Tests database performance at high request rates.
# Used to find maximum sustainable throughput.

# Infrastructure configuration
config: ../config/rsbench.config.yaml

scenario:
  executor:
    type: constant-rate
    rate: 10000         # 10K ops/sec
    duration: 300s      # 5 minutes
    max_connections: 200

  workload:
    type: declarative
    file: workloads/oltp_read_write.yaml
    overrides:
      schema:
        tables:
          - count: 20        # More tables for higher throughput
            row_count: 100000  # Larger dataset

determinism:
  seed: 42
  strict_mode: false

# Override output for this specific test
output:
  format: json
  file: results/high_throughput_{timestamp}.json
