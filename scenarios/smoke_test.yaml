# Smoke Test Scenario
#
# Quick sanity check to verify database connectivity and basic functionality.
# Runs for a short duration with low load.

scenario:
  executor:
    type: constant-rate
    rate: 100           # Low rate for quick validation
    duration: 10s       # Short duration
    max_connections: 10

  workload:
    type: declarative
    file: workloads/oltp_point_select.yaml  # Simple read-only for smoke test
    overrides:
      schema:
        tables:
          - count: 1
            row_count: 1000    # Small dataset for quick test

determinism:
  seed: 42
  strict_mode: false

output:
  format: text        # Human-readable for quick check
