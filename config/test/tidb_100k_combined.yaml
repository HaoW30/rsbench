# Combined Config for TiDB 100K QPS Test
# Has both infrastructure and scenario settings

database:
  driver: mysql
  connection_string: "mysql://root:@localhost:4000/test"
  pool:
    min_size: 20
    max_size: 200        # Must be >= runtime max_connections
    connection_timeout: 5s
    idle_timeout: 300s

runtime:
  type: async
  workers: 8
  max_connections: 200
  backpressure_threshold: 0.8

scenario:
  executor:
    type: constant-rate
    rate: 100000
    duration: 60s
    max_connections: 200

  workload:
    type: declarative
    file: workloads/oltp_point_select.yaml
    overrides:
      schema:
        tables:
          - count: 10
            row_count: 100000

determinism:
  seed: 42
  strict_mode: false

output:
  format: text
  file: null
