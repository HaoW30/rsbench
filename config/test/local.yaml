# Local Development Infrastructure Config
#
# Simple configuration for local MySQL/TiDB testing.
# Use this for development and quick tests.

database:
  driver: mysql
  connection_string: "mysql://root@127.0.0.1:4000/test"

  pool:
    min_size: 5
    max_size: 50
    connection_timeout: 5s
    idle_timeout: 300s

runtime:
  type: async
  workers: 4
  max_connections: 50
  backpressure_threshold: 0.8

output:
  format: text
  file: null
