# MySQL 50 Connections Infrastructure Config
#
# Configuration with 50 connections (pre-warmed)
# Good for moderate to high load testing

database:
  driver: mysql
  connection_string: "mysql://root@127.0.0.1:4000/test"

  pool:
    min_size: 50          # Pre-create ALL connections
    max_size: 50          # 50 connections max
    connection_timeout: 5s
    idle_timeout: 300s

runtime:
  type: async
  workers: 8
  max_connections: 50    # Match pool.max_size exactly
  backpressure_threshold: 0.8

output:
  format: text
  file: null
