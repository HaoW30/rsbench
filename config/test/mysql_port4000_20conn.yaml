# MySQL on Port 4000 - 20 Connections Test Configuration
#
# Config for testing backpressure behavior with minimal connections

database:
  driver: mysql
  connection_string: "mysql://root:@localhost:4000/test"

  pool:
    min_size: 5
    max_size: 20          # Very small pool - 20 connections max
    connection_timeout: 5s
    idle_timeout: 300s

runtime:
  type: async
  workers: 8              # Use all available CPU cores
  max_connections: 20     # Low concurrency - expect backpressure
  backpressure_threshold: 0.8

output:
  format: text
  file: null              # Output to stdout
