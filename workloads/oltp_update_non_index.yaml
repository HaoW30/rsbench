# OLTP Update Non-Index Workload
#
# Sysbench equivalent: oltp_update_non_index.lua
# Update non-indexed column workload (100% writes on non-indexed column)

workload:
  name: oltp_update_non_index
  description: "Update non-indexed column only (100% writes)"

  schema:
    tables:
      - name: sbtest
        count: 10
        row_count: 10000
        columns:
          - name: id
            type: INT
            primary_key: true
          - name: k
            type: INT
            default: 0
            index: k_idx
          - name: c
            type: CHAR(120)
            default: ""
          - name: pad
            type: CHAR(60)
            default: ""

  data_generation:
    strategy: uniform

  operations:
    # Update non-indexed column - 100%
    - name: update_non_index
      weight: 100
      type: write
      sql: "UPDATE sbtest{table_id} SET c = ? WHERE id = ?"
      parameters:
        - name: table_id
          distribution:
            type: round_robin
            range: [1, "${table_count}"]
        - name: c
          generator:
            type: string
            template: "{iteration:0>120}"
        - name: id
          distribution:
            type: uniform
            range: [1, "${row_count}"]
