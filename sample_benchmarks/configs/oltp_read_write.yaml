# OLTP Read/Write Benchmark
# Balanced workload with 60% reads and 40% writes

database:
  driver: mysql
  connection_string: "mysql://user:password@localhost:3306/testdb"
  pool:
    min_size: 5
    max_size: 50
    connection_timeout: 5s
    idle_timeout: 60s

runtime:
  mode:
    async:
      workers: 4
      max_connections: 50
      backpressure_threshold: 0.8

scenario:
  executor:
    constant_rate:
      rate: 1000  # 1000 operations per second
      duration: 60s
      max_connections: 50

  workload:
    builtin:
      name: oltp_read_write
      table_count: 10
      table_size: 10000

determinism:
  seed: 42
  strict_mode: false

output:
  format: json
  file: results_oltp_read_write.json
